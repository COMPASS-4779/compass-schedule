<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文法学習サイト v2（プロトタイプ）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --p: #1a237e;
  --a: #f57f17;
  --ok: #4caf50;
  --ng: #f44336;
  --lock: #bdbdbd;
  --bg: #f5f5f5;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Roboto, sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: #333; }

/* ===== Login ===== */
#page-login { display: none; min-height: 100vh; background: linear-gradient(135deg, var(--p) 0%, #283593 100%); justify-content: center; align-items: center; padding: 20px; }
.login-card { background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.1); width: 100%; max-width: 400px; padding: 40px; }
.login-card h1 { color: var(--p); font-size: 26px; margin-bottom: 6px; text-align: center; }
.login-card .sub { color: #999; font-size: 13px; text-align: center; margin-bottom: 22px; }
.tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
.tab { flex: 1; padding: 10px; background: #f5f5f5; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; color: #666; }
.tab.active { background: #fff; color: var(--p); border-bottom-color: var(--p); }
.fg { margin-bottom: 14px; }
.fg label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 500; }
.fi { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: var(--font); }
.fi:focus { outline: 0; border-color: var(--p); }
.err { color: var(--ng); font-size: 12px; margin-bottom: 10px; min-height: 1em; }
.btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: var(--font); font-size: 14px; transition: all .2s; }
.btn-p { background: var(--p); color: #fff; width: 100%; }
.btn-p:hover { background: #0d1b4d; }
.btn-p:disabled { background: #ccc; cursor: not-allowed; }
.btn-o { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
.btn-o:hover { background: #ececec; }
.btn-a { background: var(--a); color: #fff; }
.btn-a:hover { background: #e65e00; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-ng { background: var(--ng); color: #fff; }
.btn-lock { background: var(--lock); color: #fff; cursor: not-allowed; }

/* ===== App ===== */
#page-app { display: none; min-height: 100vh; }
.topnav { background: var(--p); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
.topnav-brand { font-size: 18px; font-weight: 700; cursor: pointer; }
.topnav-r { display: flex; gap: 12px; align-items: center; }
.user-pill { background: rgba(255,255,255,.15); padding: 5px 12px; border-radius: 20px; font-size: 13px; }
.logout { background: rgba(255,255,255,.05); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
.layout { display: flex; min-height: calc(100vh - 50px); }
.sidebar { width: 260px; background: #fff; border-right: 1px solid #e0e0e0; padding: 14px 0; overflow-y: auto; max-height: calc(100vh - 50px); position: sticky; top: 0; }
.sb-section { padding: 0 14px 6px; font-size: 11px; color: #999; font-weight: 700; letter-spacing: .05em; margin-top: 12px; }
.sb-item { padding: 9px 14px; cursor: pointer; font-size: 13px; color: #444; border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; }
.sb-item:hover { background: #f5f5f5; }
.sb-item.active { background: #f0f7ff; color: var(--p); border-left-color: var(--p); font-weight: 600; }
.sb-badge { font-size: 10px; background: #e0e0e0; color: #666; padding: 2px 7px; border-radius: 10px; }
.sb-badge.ok { background: var(--ok); color: #fff; }
.sb-badge.partial { background: var(--a); color: #fff; }
.main { flex: 1; padding: 24px; overflow-y: auto; }
.view { display: none; }
.view.active { display: block; }

/* ===== Dashboard ===== */
.h2 { color: var(--p); font-size: 22px; font-weight: 700; margin-bottom: 18px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: 8px; padding: 18px; box-shadow: 0 2px 4px rgba(0,0,0,.05); }
.stat-card .lab { font-size: 12px; color: #999; }
.stat-card .num { font-size: 30px; font-weight: 700; color: var(--p); margin: 4px 0; }
.stat-card .sub2 { font-size: 12px; color: #666; }
.bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--a); transition: width .3s; }
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.chap-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.05); cursor: pointer; transition: all .2s; border-left: 4px solid var(--p); }
.chap-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.1); }
.chap-card .ct { font-size: 11px; color: #999; }
.chap-card .cn { font-size: 16px; font-weight: 700; color: var(--p); margin: 3px 0 8px; }
.chap-card .cs { font-size: 12px; color: #666; margin-bottom: 8px; }

/* ===== Chapter ===== */
.crumb { font-size: 13px; color: #999; margin-bottom: 8px; }
.crumb a { color: var(--p); text-decoration: none; cursor: pointer; }
.crumb a:hover { text-decoration: underline; }
.item-list { display: grid; gap: 10px; }
.item-row { background: #fff; padding: 14px 18px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; cursor: pointer; transition: all .2s; }
.item-row:hover { box-shadow: 0 4px 10px rgba(0,0,0,.1); transform: translateX(2px); }
.item-row .num { font-size: 11px; color: #999; }
.item-row .nam { font-size: 15px; font-weight: 600; color: #333; margin-top: 2px; }
.stage-pills { display: flex; gap: 4px; }
.spill { font-size: 11px; padding: 3px 7px; border-radius: 4px; background: #eee; color: #999; font-weight: 600; }
.spill.passed { background: var(--ok); color: #fff; }
.spill.locked { background: var(--lock); color: #fff; }
.spill.tried { background: var(--a); color: #fff; }
.cleared-badge { background: linear-gradient(135deg, var(--ok), #2e7d32); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 14px; font-weight: 700; }
.preparing { background: #fff; color: #999; padding: 14px 18px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.03); font-size: 13px; text-align: center; }

/* ===== Item Detail ===== */
.item-head { background: #fff; padding: 22px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.05); margin-bottom: 18px; }
.item-head .num { font-size: 12px; color: #999; }
.item-head h3 { font-size: 22px; color: var(--p); margin-top: 4px; }
.stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.stage-card { background: #fff; border-radius: 8px; padding: 18px; box-shadow: 0 2px 4px rgba(0,0,0,.05); border-top: 4px solid #999; transition: all .2s; }
.stage-card.kaisetsu { border-top-color: #1976d2; }
.stage-card.enshu { border-top-color: var(--a); }
.stage-card.shujuku { border-top-color: var(--ok); }
.stage-card.shutoku { border-top-color: #6a1b9a; }
.stage-card.locked { opacity: .55; }
.stage-card .lab { font-size: 11px; color: #999; letter-spacing: .05em; }
.stage-card .ttl { font-size: 17px; font-weight: 700; color: #333; margin: 4px 0 8px; display: flex; align-items: center; gap: 6px; }
.stage-card .desc { font-size: 12px; color: #666; margin-bottom: 12px; min-height: 30px; }
.stage-card .scor { font-size: 12px; color: #555; margin-bottom: 10px; }
.stage-card .stat-line { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #999; margin-bottom: 12px; }
.stage-card button { width: 100%; padding: 9px; }
.cleared-banner { background: linear-gradient(135deg, var(--ok), #1b5e20); color: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 14px; font-weight: 700; text-align: center; }

/* ===== Slides ===== */
.slide-wrap { background: #fff; border-radius: 8px; padding: 30px 36px; box-shadow: 0 2px 4px rgba(0,0,0,.05); max-width: 820px; margin: 0 auto; }
.slide-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 2px solid #e0e0e0; margin-bottom: 18px; }
.slide-head .ttl { font-size: 22px; font-weight: 700; color: var(--p); }
.slide-num { background: var(--a); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.slide-body { white-space: pre-wrap; font-size: 15px; line-height: 1.8; color: #333; margin-bottom: 18px; }
.ex-box { background: #f9f9f9; border-left: 4px solid var(--a); padding: 14px 18px; border-radius: 4px; margin-bottom: 14px; }
.ex-row { margin-bottom: 10px; }
.ex-row:last-child { margin-bottom: 0; }
.ex-en { font-size: 14px; font-weight: 600; color: var(--p); }
.ex-ja { font-size: 13px; color: #666; margin-top: 2px; }
.slide-nav { display: flex; gap: 10px; justify-content: center; margin-top: 24px; }

/* ===== Quiz ===== */
.quiz-wrap { background: #fff; border-radius: 8px; padding: 30px 36px; box-shadow: 0 2px 4px rgba(0,0,0,.05); max-width: 820px; margin: 0 auto; }
.quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #e0e0e0; }
.quiz-meta .meta-l { font-size: 13px; color: #666; }
.quiz-meta .meta-l .stage-name { font-weight: 700; color: var(--p); }
.qprog { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
.qprog > div { height: 100%; background: var(--a); transition: width .3s; }
.q-num { font-size: 12px; color: #999; }
.q-text { font-size: 17px; font-weight: 600; color: #333; margin: 6px 0 18px; line-height: 1.5; }
.choices { display: grid; gap: 10px; }
.choice { padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; font-size: 14px; transition: all .2s; }
.choice:hover { border-color: var(--a); background: #fffbf5; }
.choice.selected { border-color: var(--p); background: #e8edf8; color: var(--p); font-weight: 600; }
.qbtns { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; }

/* ===== Result ===== */
.res-wrap { background: #fff; border-radius: 8px; padding: 30px 36px; box-shadow: 0 2px 4px rgba(0,0,0,.05); max-width: 820px; margin: 0 auto; }
.res-score { text-align: center; padding: 20px 0; }
.res-score .big { font-size: 56px; font-weight: 700; color: var(--p); }
.res-score .lab { font-size: 14px; color: #999; margin-top: 4px; }
.res-judge { text-align: center; padding: 14px; border-radius: 8px; margin: 18px 0; font-weight: 700; }
.res-judge.pass { background: #e8f5e9; color: var(--ok); border: 2px solid var(--ok); }
.res-judge.fail { background: #ffebee; color: var(--ng); border: 2px solid var(--ng); }
.res-list { margin: 22px 0; }
.res-item { padding: 12px 16px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
.res-item.ok { background: #e8f5e9; }
.res-item.ng { background: #ffebee; }
.res-item .qq { font-weight: 600; }
.res-item .ans { margin-top: 4px; color: #555; }
.res-item .exp { margin-top: 4px; color: #777; font-size: 12px; }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

/* ===== Toast ===== */
#toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 2000; display: none; }
#toast.show { display: block; animation: slide .25s ease-out; }
#toast.ok { background: var(--ok); }
#toast.ng { background: var(--ng); }
@keyframes slide { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="page-login">
  <div class="login-card">
    <h1>📚 英文法学習サイト</h1>
    <p class="sub">v2 プロトタイプ（段階制ロック式）</p>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">ログイン</button>
      <button class="tab" onclick="switchTab('reg')">新規登録</button>
    </div>
    <div id="form-login">
      <div class="fg"><label>ユーザーID</label><input id="li-id" class="fi" placeholder="例: demo / admin"></div>
      <div class="fg"><label>パスワード</label><input id="li-pw" type="password" class="fi" placeholder="例: demo / admin"></div>
      <div id="li-err" class="err"></div>
      <button class="btn btn-p" onclick="doLogin()">ログイン</button>
      <p style="text-align:center;margin-top:12px;font-size:12px;color:#999">demo/demo または admin/admin で入れます</p>
    </div>
    <div id="form-reg" style="display:none">
      <div class="fg"><label>ユーザーID</label><input id="ri-id" class="fi"></div>
      <div class="fg"><label>お名前</label><input id="ri-name" class="fi"></div>
      <div class="fg"><label>パスワード</label><input id="ri-pw" type="password" class="fi"></div>
      <div id="ri-err" class="err"></div>
      <button class="btn btn-p" onclick="doRegister()">登録</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="page-app">
  <div class="topnav">
    <div class="topnav-brand" onclick="goView('dashboard')">📚 英文法学習サイト</div>
    <div class="topnav-r">
      <span class="user-pill"><span id="nv-name"></span>（<span id="nv-role"></span>）</span>
      <button class="logout" onclick="doLogout()">ログアウト</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <!-- Dashboard -->
      <div id="view-dashboard" class="view">
        <div class="h2">🏠 ダッシュボード</div>
        <div class="stat-grid" id="stat-grid"></div>
        <div class="h2" style="font-size:18px;margin-top:8px">📖 章を選んで学習を始める</div>
        <div class="chap-grid" id="chap-grid"></div>
      </div>
      <!-- Chapter -->
      <div id="view-chapter" class="view">
        <div class="crumb"><a onclick="goView('dashboard')">ダッシュボード</a> ▸ <span id="ch-crumb"></span></div>
        <div class="h2" id="ch-title"></div>
        <div class="item-list" id="ch-items"></div>
      </div>
      <!-- Item Detail -->
      <div id="view-item" class="view">
        <div class="crumb"><a onclick="goView('dashboard')">ダッシュボード</a> ▸ <a id="it-crumb-ch"></a> ▸ <span id="it-crumb"></span></div>
        <div id="it-cleared"></div>
        <div class="item-head">
          <div class="num" id="it-num"></div>
          <h3 id="it-name"></h3>
        </div>
        <div class="stage-grid" id="it-stages"></div>
      </div>
      <!-- Slides -->
      <div id="view-slides" class="view"><div id="slide-host"></div></div>
      <!-- Quiz -->
      <div id="view-quiz" class="view"><div id="quiz-host"></div></div>
      <!-- Result -->
      <div id="view-result" class="view"><div id="result-host"></div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   英文法学習サイト v2  プロトタイプ
   - 段階制ロック（演習85% → 習熟解放 → 85% → 習得解放 → 85%でクリア）
   - サンプル：第02章「受動態」3項目 + 第03章「助動詞」1項目
   - 進捗は localStorage に保存
   ============================================================ */

const PASS_MARK = 85;
const QUIZ_Q_COUNT = 10;          // 1セッション 10問予定。サンプルは5問プールなので min(プール, 10)
const STORAGE_USER = 'grm_v2_user';
const STORAGE_STAGE = 'grm_v2_stage';   // { uid: { itemId: { enshu:{best,passed,...}, shujuku:{...}, shutoku:{...} } } }
const STORAGE_USERS = 'grm_v2_users';   // { uid: {name, pw, role} }

/* ============================================================
   サンプルカリキュラム（プロトタイプ用最小データ）
   実装版では build_curriculum.py で全章自動生成して埋め込む
   ============================================================ */
const CURRICULUM = {
  meta: { version: "2.0-proto", passMark: PASS_MARK },
  chapters: [
    {
      id: "ch01", num: 1, title: "時制", color: "#4caf50",
      items: [{ id: "ch01_001", num: "001", name: "「現在形」と「現在進行形」", _stub: true }]
    },
    {
      id: "ch02", num: 2, title: "受動態", color: "#1976d2",
      items: [
        {
          id: "ch02_001", num: "001", name: "「受動態」とは？",
          slides: [
            {
              title: "受動態の基本形",
              content: "■ 能動態：主語が「～する」\n■ 受動態：主語が「～される」\n■ 形：be動詞 + 過去分詞（+ by 行為者）",
              examples: [
                { en: "Tom loves Carol.", ja: "トムはキャロルを愛している（能動態）" },
                { en: "Carol is loved by Tom.", ja: "キャロルはトムに愛されている（受動態）" }
              ]
            },
            {
              title: "時制と受動態",
              content: "be動詞の形を時制で変化させる。\n■ 現在：is/am/are + 過去分詞\n■ 過去：was/were + 過去分詞\n■ 未来：will be + 過去分詞",
              examples: [
                { en: "The book is read by many people.", ja: "その本は多くの人に読まれている" },
                { en: "The letter was written yesterday.", ja: "その手紙は昨日書かれた" }
              ]
            },
            {
              title: "覚えておきたいポイント",
              content: "■ 過去分詞は不規則動詞に注意（write→written, take→taken）\n■ by 以外の前置詞をとる受動態もある（be covered with 雪 など）",
              examples: [
                { en: "The mountain is covered with snow.", ja: "山は雪で覆われている" }
              ]
            }
          ],
          stages: {
            enshu: { label: "演習", questions: [
              { q: "Tom loves Carol. を受動態にしたとき、空所に入るのは？  Carol ___ by Tom.", ch: ["love", "loves", "is loved", "was loved"], a: 2, exp: "現在形の受動態は is/am/are + 過去分詞。", cat: "受動態の基本" },
              { q: "彼らはケンを愛していた。 → They ___ Ken.", ch: ["love", "loved", "loving", "are loving"], a: 1, exp: "「愛していた」は過去形 loved。", cat: "受動態の基本" },
              { q: "ケンは彼らに愛されていた。 → Ken ___ by them.", ch: ["is loved", "was loved", "loved", "were loved"], a: 1, exp: "Ken は単数なので was loved。", cat: "受動態の基本" },
              { q: "ワインはぶどうから作られる。 → Wine ___ from grapes.", ch: ["makes", "is made", "made", "is making"], a: 1, exp: "原料を表す『～から作られる』は be made from。", cat: "by以外の受動態" },
              { q: "私は幼年時代にトミーと呼ばれていた。 → I ___ Tommy during my childhood.", ch: ["called", "was called", "am called", "have called"], a: 1, exp: "過去のことなので was called。", cat: "受動態の基本" }
            ]},
            shujuku: { label: "習熟", questions: [
              { q: "メアリーは私たちを夕食に招待した。 → Mary ___ us to dinner.", ch: ["invites", "invited", "was invited", "is inviting"], a: 1, exp: "能動態の過去形 invited。", cat: "受動態の基本" },
              { q: "私たちはメアリーに招待された。 → We ___ to dinner by Mary.", ch: ["invited", "are invited", "were invited", "have invited"], a: 2, exp: "we は複数なので were invited。", cat: "受動態の基本" },
              { q: "そのいすは妹の部屋で使われている。 → The chair ___ in my sister's room.", ch: ["used", "is used", "is using", "was used"], a: 1, exp: "現在のことを表すので is used。", cat: "受動態の基本" },
              { q: "この像は1886年に建てられた。 → This statue ___ in 1886.", ch: ["built", "is built", "was built", "is building"], a: 2, exp: "1886年は過去なので was built。", cat: "受動態の基本" },
              { q: "私のささいな秘密はだれにも知られていない。 → My little secret ___ to anyone.", ch: ["doesn't know", "is not known", "was not known", "is not knowing"], a: 1, exp: "現在の否定の受動態 is not known。", cat: "受動態の否定" }
            ]},
            shutoku: { label: "習得", questions: [

let state = {
  user: null,                  // {uid, name, role}
  currentChapter: null,        // chapter object
  currentItem: null,           // item object
  currentStage: null,          // 'enshu' | 'shujuku' | 'shutoku'
  currentSlideIdx: 0,
  currentQs: [],               // shuffled questions for this attempt
  currentAns: []               // answer indices, -1 if unanswered
};

/* ============================================================
   起動
   ============================================================ */
function init() {
  // デフォルトユーザー
  let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  if (!users.demo)  users.demo  = { name:'デモ太郎', pw:'demo',  role:'student' };
  if (!users.admin) users.admin = { name:'管理者',   pw:'admin', role:'admin'   };
  localStorage.setItem(STORAGE_USERS, JSON.stringify(users));

  const u = JSON.parse(localStorage.getItem(STORAGE_USER) || 'null');
  if (u) { state.user = u; enterApp(); } else { showLogin(); }
}

/* ============================================================
   ログイン関連
   ============================================================ */
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('form-login').style.display = (t==='login') ? 'block':'none';
  document.getElementById('form-reg').style.display   = (t==='reg')   ? 'block':'none';
}
function showLogin() { document.getElementById('page-login').style.display='flex'; document.getElementById('page-app').style.display='none'; }
function enterApp()  { document.getElementById('page-login').style.display='none'; document.getElementById('page-app').style.display='block';
  document.getElementById('nv-name').textContent = state.user.name;
  document.getElementById('nv-role').textContent = state.user.role;
  renderSidebar(); goView('dashboard');
}
function doLogin() {
  const id=document.getElementById('li-id').value.trim();
  const pw=document.getElementById('li-pw').value;
  const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  if (!users[id] || users[id].pw !== pw) { document.getElementById('li-err').textContent='IDかパスワードが違います'; return; }
  state.user = { uid:id, name:users[id].name, role:users[id].role };
  localStorage.setItem(STORAGE_USER, JSON.stringify(state.user));
  enterApp();
}
function doRegister() {
  const id=document.getElementById('ri-id').value.trim();
  const nm=document.getElementById('ri-name').value.trim();
  const pw=document.getElementById('ri-pw').value;
  if (!id||!nm||!pw) { document.getElementById('ri-err').textContent='全項目入力してください'; return; }
  const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  if (users[id]) { document.getElementById('ri-err').textContent='既存のIDです'; return; }
  users[id] = { name:nm, pw:pw, role:'student' };
  localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
  state.user = { uid:id, name:nm, role:'student' };
  localStorage.setItem(STORAGE_USER, JSON.stringify(state.user));
  enterApp();
}
function doLogout() { localStorage.removeItem(STORAGE_USER); state.user=null; showLogin(); }

/* ============================================================
   進捗（localStorage）
   ============================================================ */
function getStageStatus() {
  const all = JSON.parse(localStorage.getItem(STORAGE_STAGE) || '{}');
  return all[state.user.uid] || {};
}
function saveStageResult(itemId, stage, score) {
  const all = JSON.parse(localStorage.getItem(STORAGE_STAGE) || '{}');
  if (!all[state.user.uid]) all[state.user.uid] = {};
  if (!all[state.user.uid][itemId]) all[state.user.uid][itemId] = {};
  const cur = all[state.user.uid][itemId][stage] || { best:0, attempts:0, passed:false };
  cur.attempts += 1;
  cur.best = Math.max(cur.best, score);
  cur.last = Date.now();
  if (score >= PASS_MARK && !cur.passed) { cur.passed = true; cur.passed_at = new Date().toISOString().slice(0,10); }
  all[state.user.uid][itemId][stage] = cur;
  localStorage.setItem(STORAGE_STAGE, JSON.stringify(all));
  return cur;
}
function getItemStageState(itemId) {
  const s = getStageStatus()[itemId] || {};
  return {
    enshu:   { unlocked: true,                        best: s.enshu?.best   || 0, passed: s.enshu?.passed   || false, attempts: s.enshu?.attempts || 0 },
    shujuku: { unlocked: !!s.enshu?.passed,           best: s.shujuku?.best || 0, passed: s.shujuku?.passed || false, attempts: s.shujuku?.attempts || 0 },
    shutoku: { unlocked: !!s.shujuku?.passed,         best: s.shutoku?.best || 0, passed: s.shutoku?.passed || false, attempts: s.shutoku?.attempts || 0 }
  };
}
function isItemCleared(itemId) { return getItemStageState(itemId).shutoku.passed; }
function chapterProgress(ch) {
  const real = ch.items.filter(i => !i._stub);
  const cleared = real.filter(i => isItemCleared(i.id)).length;
  return { total: real.length, cleared };
}

/* ============================================================
   サイドバー
   ============================================================ */
function renderSidebar() {
  let html = '<div class="sb-section">学習</div>';
  html += '<div class="sb-item" onclick="goView(\'dashboard\')">🏠 ダッシュボード</div>';
  html += '<div class="sb-section">章一覧（17）</div>';
  CURRICULUM.chapters.forEach(ch => {
    const { total, cleared } = chapterProgress(ch);
    const badge = ch._preparing ? '<span class="sb-badge">準備中</span>'
                  : (total===0 ? '<span class="sb-badge">準備中</span>'
                     : (cleared===total ? '<span class="sb-badge ok">完了</span>'
                        : (cleared>0 ? `<span class="sb-badge partial">${cleared}/${total}</span>`
                           : `<span class="sb-badge">${cleared}/${total}</span>`)));
    html += `<div class="sb-item" onclick="openChapter('${ch.id}')"><span>📖 第${String(ch.num).padStart(2,'0')}章 ${ch.title}</span>${badge}</div>`;
  });
  if (state.user.role === 'admin') {
    html += '<div class="sb-section">管理</div>';
    html += '<div class="sb-item" onclick="toast(\'管理機能はv2では今後追加予定\',\'ok\')">👥 ユーザー管理</div>';
  }
  document.getElementById('sidebar').innerHTML = html;
}

/* ============================================================
   ビュー切替
   ============================================================ */
function goView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  const el = document.getElementById('view-'+v); if (el) el.classList.add('active');
  if (v==='dashboard') renderDashboard();
}

/* ============================================================
   ダッシュボード
   ============================================================ */
function renderDashboard() {
  // stats
  let totalItems=0, clearedItems=0, totalAttempts=0, totalPassed=0;
  CURRICULUM.chapters.forEach(ch => {
    ch.items.forEach(it => {
      if (it._stub || it._preparing) return;
      totalItems++;
      const ss = getItemStageState(it.id);
      ['enshu','shujuku','shutoku'].forEach(s => {
        totalAttempts += ss[s].attempts;
        if (ss[s].passed) totalPassed++;
      });
      if (isItemCleared(it.id)) clearedItems++;
    });
  });
  const sg = document.getElementById('stat-grid');
  sg.innerHTML = `
    <div class="stat-card"><div class="lab">クリア項目</div><div class="num">${clearedItems} / ${totalItems}</div>
      <div class="bar"><div style="width:${totalItems?Math.round(clearedItems/totalItems*100):0}%"></div></div>
      <div class="sub2" style="margin-top:6px">3段階すべて85%以上の項目数</div></div>
    <div class="stat-card"><div class="lab">合格段階数</div><div class="num">${totalPassed}</div><div class="sub2">演習・習熟・習得 合計</div></div>
    <div class="stat-card"><div class="lab">総挑戦回数</div><div class="num">${totalAttempts}</div><div class="sub2">これまでに解いたセッション</div></div>
    <div class="stat-card"><div class="lab">合格ライン</div><div class="num">${PASS_MARK}%</div><div class="sub2">各段階の合格基準</div></div>`;

  const cg = document.getElementById('chap-grid');
  cg.innerHTML = '';
  CURRICULUM.chapters.forEach(ch => {
    const { total, cleared } = chapterProgress(ch);
    const isReady = !ch._preparing && total>0;
    const card = document.createElement('div');
    card.className = 'chap-card';
    card.style.borderLeftColor = ch.color;
    card.style.opacity = isReady ? '1':'.55';
    card.innerHTML = `
      <div class="ct">第${String(ch.num).padStart(2,'0')}章</div>
      <div class="cn">${ch.title}</div>
      <div class="cs">${isReady ? `項目 ${total}・クリア ${cleared}` : '準備中'}</div>
      <div class="bar"><div style="width:${total?Math.round(cleared/total*100):0}%;background:${ch.color}"></div></div>`;
    if (isReady) card.onclick = () => openChapter(ch.id);
    else card.onclick = () => toast('この章はサンプルプロトタイプには未収録です','ok');
    cg.appendChild(card);
  });
}

/* ============================================================
   章ビュー
   ============================================================ */
function openChapter(id) {
  const ch = CURRICULUM.chapters.find(c => c.id===id);
  if (!ch) return;
  state.currentChapter = ch;
  document.getElementById('ch-crumb').textContent = `第${String(ch.num).padStart(2,'0')}章 ${ch.title}`;
  document.getElementById('ch-title').textContent = `📖 第${String(ch.num).padStart(2,'0')}章 ${ch.title}`;
  const host = document.getElementById('ch-items');
  host.innerHTML = '';
  if (ch._preparing || ch.items.length===0) {
    host.innerHTML = '<div class="preparing">この章はプロトタイプには未収録です。設計書 §5 に従って後段でビルドします。</div>';
    goView('chapter'); return;
  }
  ch.items.forEach(it => {
    if (it._stub) {
      host.innerHTML += `<div class="preparing">第${ch.num}章-${it.num} ${it.name}（プロトタイプ未収録）</div>`;
      return;
    }
    const ss = getItemStageState(it.id);
    const cleared = isItemCleared(it.id);
    const pill = (s, st) => {
      if (st.passed) return `<span class="spill passed">${s} ✓</span>`;
      if (!st.unlocked) return `<span class="spill locked">${s} 🔒</span>`;
      if (st.attempts > 0) return `<span class="spill tried">${s} ${st.best}%</span>`;
      return `<span class="spill">${s}</span>`;
    };
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div><div class="num">${it.num}</div><div class="nam">${it.name}</div></div>
      <div class="stage-pills">${pill('演習',ss.enshu)}${pill('習熟',ss.shujuku)}${pill('習得',ss.shutoku)}</div>
      <div>${cleared ? '<span class="cleared-badge">🏆 CLEAR</span>' : '<span style="color:#999;font-size:12px">学習する ▸</span>'}</div>`;
    row.onclick = () => openItem(it.id);
    host.appendChild(row);
  });
  goView('chapter');
}

/* ============================================================
   項目ビュー
   ============================================================ */
function openItem(id) {
  const ch = state.currentChapter;
  const it = ch.items.find(i => i.id===id);
  if (!it || it._stub) { toast('この項目は未収録です','ok'); return; }
  state.currentItem = it;
  document.getElementById('it-crumb').textContent = `${it.num} ${it.name}`;
  const a = document.getElementById('it-crumb-ch'); a.textContent = `第${String(ch.num).padStart(2,'0')}章 ${ch.title}`;
  a.onclick = () => openChapter(ch.id);
  document.getElementById('it-num').textContent = `第${String(ch.num).padStart(2,'0')}章 - ${it.num}`;
  document.getElementById('it-name').textContent = it.name;

  const cleared = isItemCleared(it.id);
  document.getElementById('it-cleared').innerHTML = cleared
    ? '<div class="cleared-banner">🏆 この項目は3段階すべて85%以上を達成しています！</div>' : '';

  const ss = getItemStageState(it.id);
  const host = document.getElementById('it-stages');
  host.innerHTML = '';

  // 解説カード
  host.appendChild(makeStageCard({
    cls:'kaisetsu', label:'STEP 0', title:'📘 解説',
    desc:`${it.slides?.length||0}枚のスライドで仕組みを学習`,
    line:'いつでも何度でも閲覧可能',
    btn:{ text:'解説を開く', cls:'btn-p', enabled:true, onclick:()=>openSlides(it.id) }
  }));
  // 演習
  host.appendChild(makeStageCardForStage('enshu','STEP 1','📝 演習','基礎レベルの確認問題',ss.enshu,it));
  // 習熟
  host.appendChild(makeStageCardForStage('shujuku','STEP 2','✏️ 習熟','少し応用した問題で定着',ss.shujuku,it,'演習で85%以上 → 解放'));
  // 習得
  host.appendChild(makeStageCardForStage('shutoku','STEP 3','🎯 習得','入試レベルの仕上げ問題',ss.shutoku,it,'習熟で85%以上 → 解放'));

  goView('item');
}
function makeStageCard(o) {
  const d = document.createElement('div');
  d.className = 'stage-card '+o.cls + (o.locked?' locked':'');
  d.innerHTML = `<div class="lab">${o.label}</div><div class="ttl">${o.title} ${o.tag||''}</div>
    <div class="desc">${o.desc||''}</div><div class="stat-line">${o.line||''}</div>
    <button class="btn ${o.btn.cls}" ${o.btn.enabled?'':'disabled'}>${o.btn.text}</button>`;
  d.querySelector('button').onclick = o.btn.onclick;
  return d;
}
function makeStageCardForStage(stage, lab, ttl, desc, st, it, lockMsg) {
  const tag = st.passed ? '✅' : (st.attempts>0 ? '🔄' : (st.unlocked ? '' : '🔒'));
  const line = st.attempts>0 ? `挑戦 ${st.attempts}回 / 最高 ${st.best}%` : (st.unlocked ? '挑戦待ち' : (lockMsg||''));
  let btnText, btnCls, enabled, click;
  if (!st.unlocked) { btnText='🔒 ロック中'; btnCls='btn-lock'; enabled=false; }
  else if (st.passed) { btnText='もう一度挑戦'; btnCls='btn-o'; enabled=true; click=()=>startQuiz(it.id, stage); }
  else                 { btnText=stage==='enshu'?'演習に挑戦':(stage==='shujuku'?'習熟に挑戦':'習得に挑戦'); btnCls='btn-a'; enabled=true; click=()=>startQuiz(it.id, stage); }
  return makeStageCard({ cls:stage, label:lab, title:ttl, tag, desc, line, locked:!st.unlocked, btn:{text:btnText, cls:btnCls, enabled, onclick:click} });
}

/* ============================================================
   解説スライド
   ============================================================ */
function openSlides(itemId) {
  const it = state.currentItem; if (!it.slides) { toast('スライド未登録','ok'); return; }
  state.currentSlideIdx = 0; renderSlide(); goView('slides');
}
function renderSlide() {
  const it = state.currentItem;
  const i = state.currentSlideIdx;
  const s = it.slides[i];
  let exHtml = '';
  if (s.examples?.length) {
    exHtml = '<div class="ex-box">' + s.examples.map(e => `<div class="ex-row"><div class="ex-en">${e.en}</div><div class="ex-ja">${e.ja}</div></div>`).join('') + '</div>';
  }
  document.getElementById('slide-host').innerHTML = `
    <div class="slide-wrap">
      <div class="slide-head">
        <div class="ttl">${s.title}</div>
        <span class="slide-num">${i+1} / ${it.slides.length}</span>
      </div>
      <div class="slide-body">${s.content}</div>
      ${exHtml}
      <div class="slide-nav">
        <button class="btn btn-o" onclick="prevSlide()" ${i===0?'disabled':''}>← 前へ</button>
        <button class="btn btn-o" onclick="openItem('${it.id}')">項目に戻る</button>
        ${i<it.slides.length-1
          ? `<button class="btn btn-p" onclick="nextSlide()">次へ →</button>`
          : `<button class="btn btn-a" onclick="openItem('${it.id}')">演習へ進む →</button>`}
      </div>
    </div>`;
}
function prevSlide() { if (state.currentSlideIdx>0) { state.currentSlideIdx--; renderSlide(); } }
function nextSlide() { if (state.currentSlideIdx<state.currentItem.slides.length-1) { state.currentSlideIdx++; renderSlide(); } }

/* ============================================================
   問題演習
   ============================================================ */
function startQuiz(itemId, stage) {
  const it = state.currentItem;
  const ss = getItemStageState(itemId);
  if (!ss[stage].unlocked) { toast('まだロックされています','ng'); return; }
  state.currentStage = stage;
  // シャッフル & 抽出
  const pool = it.stages[stage].questions.slice();
  shuffle(pool);
  state.currentQs = pool.slice(0, Math.min(QUIZ_Q_COUNT, pool.length));
  state.currentAns = state.currentQs.map(()=>-1);
  renderQuiz(0);
  goView('quiz');
}
function shuffle(a) { for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function renderQuiz(qi) {
  const q = state.currentQs[qi]; const total = state.currentQs.length;
  const stageLabel = state.currentItem.stages[state.currentStage].label;
  const choicesHtml = q.ch.map((c,i) => `<div class="choice ${state.currentAns[qi]===i?'selected':''}" onclick="pickAns(${qi},${i})">${String.fromCharCode(65+i)}. ${escapeHtml(c)}</div>`).join('');
  const answered = state.currentAns.filter(x => x>=0).length;
  document.getElementById('quiz-host').innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-meta">
        <div class="meta-l">第${String(state.currentChapter.num).padStart(2,'0')}章 ${state.currentChapter.title} / ${state.currentItem.name} <span class="stage-name">[${stageLabel}]</span></div>
        <div class="meta-l">解答済 ${answered} / ${total}</div>
      </div>
      <div class="qprog"><div style="width:${(qi+1)/total*100}%"></div></div>
      <div class="q-num">第 ${qi+1} 問</div>
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="choices">${choicesHtml}</div>
      <div class="qbtns">
        <button class="btn btn-o" ${qi===0?'disabled':''} onclick="renderQuiz(${qi-1})">← 前の問題</button>
        ${qi<total-1
          ? `<button class="btn btn-p" onclick="renderQuiz(${qi+1})">次の問題 →</button>`
          : `<button class="btn btn-a" onclick="submitQuiz()" ${answered<total?'disabled':''}>採点する</button>`}
      </div>
      ${qi===total-1 && answered<total ? '<div style="text-align:right;color:#f44336;font-size:12px;margin-top:6px">未回答の問題があります</div>' : ''}
    </div>`;
}
function pickAns(qi, ci) { state.currentAns[qi] = ci; renderQuiz(qi); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   採点・結果
   ============================================================ */
function submitQuiz() {
  const it = state.currentItem; const stage = state.currentStage;
  const total = state.currentQs.length;
  let correct = 0;
  state.currentQs.forEach((q,i) => { if (state.currentAns[i]===q.a) correct++; });
  const score = Math.round(correct/total*100);
  const cur = saveStageResult(it.id, stage, score);
  const passed = score >= PASS_MARK;
  const stageLabel = it.stages[stage].label;
  const next = stage==='enshu' ? 'shujuku' : (stage==='shujuku' ? 'shutoku' : null);
  const nextLabel = next ? it.stages[next].label : null;

  const detailHtml = state.currentQs.map((q,i) => {
    const ok = state.currentAns[i]===q.a;
    return `<div class="res-item ${ok?'ok':'ng'}">
      <div class="qq">${ok?'✅':'✗'} 第${i+1}問　${escapeHtml(q.q)}</div>
      <div class="ans">あなた: ${state.currentAns[i]>=0 ? escapeHtml(q.ch[state.currentAns[i]]) : '（未回答）'}　/　正解: ${escapeHtml(q.ch[q.a])}</div>
      <div class="exp">解説: ${escapeHtml(q.exp)}</div></div>`;
  }).join('');

  let nextActions = '';
  if (passed) {
    if (next) {
      nextActions = `<button class="btn btn-a" onclick="startQuiz('${it.id}','${next}')">${nextLabel}に進む →</button>
                     <button class="btn btn-o" onclick="openItem('${it.id}')">項目TOPへ</button>`;
    } else {
      nextActions = `<button class="btn btn-ok" onclick="openItem('${it.id}')">🏆 項目クリア！TOPへ</button>`;
    }
  } else {
    nextActions = `<button class="btn btn-a" onclick="startQuiz('${it.id}','${stage}')">同じ段階を再挑戦</button>
                   <button class="btn btn-o" onclick="openSlides('${it.id}')">解説に戻る</button>
                   <button class="btn btn-o" onclick="openItem('${it.id}')">項目TOPへ</button>`;
  }

  document.getElementById('result-host').innerHTML = `
    <div class="res-wrap">
      <div class="quiz-meta">
        <div class="meta-l">${it.name} <span class="stage-name">[${stageLabel}]</span> 結果</div>
        <div class="meta-l">これまでの最高: ${cur.best}% / 挑戦${cur.attempts}回</div>
      </div>
      <div class="res-score"><div class="big">${score}</div><div class="lab">${correct} / ${total} 問正解</div></div>
      <div class="res-judge ${passed?'pass':'fail'}">
        ${passed
          ? (next ? `🎉 合格！「${nextLabel}」が解放されました` : '🏆 おめでとう！この項目をクリアしました（3段階すべて達成）')
          : `😢 不合格（合格は${PASS_MARK}%以上） — 解説を読み直してもう一度挑戦しましょう`}
      </div>
      <div class="res-list">${detailHtml}</div>
      <div class="res-actions">${nextActions}</div>
    </div>`;
  goView('result');
  toast(passed ? '合格！' : `あと${PASS_MARK-score}%`, passed?'ok':'ng');
}

/* ============================================================
   トースト
   ============================================================ */
function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + (kind||'ok');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.className='', 2200);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
