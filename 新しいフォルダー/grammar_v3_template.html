<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文法学習サイト v3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --p: #1a237e; --a: #f57f17; --ok: #4caf50; --ng: #f44336;
  --lock: #bdbdbd; --bg: #f5f5f5;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", "Meiryo", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
body { font-family: var(--font); background: var(--bg); color: #333; }

/* ===== Login ===== */
#page-login { display: none; min-height: 100vh; background: linear-gradient(135deg, var(--p) 0%, #283593 100%); justify-content: center; align-items: center; padding: 20px; }
.login-card { background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.1); width: 100%; max-width: 400px; padding: 40px; }
.login-card h1 { color: var(--p); font-size: 26px; margin-bottom: 6px; text-align: center; }
.login-card .sub { color: #999; font-size: 13px; text-align: center; margin-bottom: 22px; }
.tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
.tab { flex: 1; padding: 10px; background: #f5f5f5; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; color: #666; }
.tab.active { background: #fff; color: var(--p); border-bottom-color: var(--p); }
.fg { margin-bottom: 14px; }
.fg label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 500; }
.fi { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: var(--font); }
.fi:focus { outline: 0; border-color: var(--p); }
.err { color: var(--ng); font-size: 12px; margin-bottom: 10px; min-height: 1em; }
.btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: var(--font); font-size: 14px; transition: all .2s; }
.btn-p { background: var(--p); color: #fff; width: 100%; }
.btn-p:hover { background: #0d1b4d; }
.btn-p:disabled { background: #ccc; cursor: not-allowed; }
.btn-o { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
.btn-o:hover { background: #ececec; }
.btn-a { background: var(--a); color: #fff; }
.btn-a:hover { background: #e65e00; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-ng { background: var(--ng); color: #fff; }
.btn-lock { background: var(--lock); color: #fff; cursor: not-allowed; }
.btn-print { background: #455a64; color: #fff; }
.btn-print:hover { background: #263238; }

/* ===== App ===== */
#page-app { display: none; min-height: 100vh; }
.topnav { background: var(--p); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
.topnav-brand { font-size: 18px; font-weight: 700; cursor: pointer; }
.topnav-r { display: flex; gap: 12px; align-items: center; }
.user-pill { background: rgba(255,255,255,.15); padding: 5px 12px; border-radius: 20px; font-size: 13px; }
.logout { background: rgba(255,255,255,.05); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
.layout { display: flex; min-height: calc(100vh - 50px); }
.sidebar { width: 280px; background: #fff; border-right: 1px solid #e0e0e0; padding: 14px 0; overflow-y: auto; max-height: calc(100vh - 50px); position: sticky; top: 0; }
.sb-section { padding: 10px 14px 6px; font-size: 11px; color: #999; font-weight: 700; letter-spacing: .05em; }
.sb-item { padding: 9px 14px; cursor: pointer; font-size: 13px; color: #444; border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sb-item:hover { background: #f5f5f5; }
.sb-item.active { background: #f0f7ff; color: var(--p); border-left-color: var(--p); font-weight: 600; }
.sb-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-badge { font-size: 10px; background: #e0e0e0; color: #666; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
.sb-badge.ok { background: var(--ok); color: #fff; }
.sb-badge.partial { background: var(--a); color: #fff; }
.main { flex: 1; padding: 24px; overflow-y: auto; max-width: calc(100vw - 280px); }
.view { display: none; }
.view.active { display: block; }

/* ===== Common ===== */
.h2 { color: var(--p); font-size: 22px; font-weight: 700; margin-bottom: 18px; }
.crumb { font-size: 13px; color: #999; margin-bottom: 8px; }
.crumb a { color: var(--p); text-decoration: none; cursor: pointer; }
.crumb a:hover { text-decoration: underline; }
.bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--a); transition: width .3s; }

/* ===== Dashboard ===== */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: 8px; padding: 18px; box-shadow: 0 2px 4px rgba(0,0,0,.05); }
.stat-card .lab { font-size: 12px; color: #999; }
.stat-card .num { font-size: 30px; font-weight: 700; color: var(--p); margin: 4px 0; }
.stat-card .sub2 { font-size: 12px; color: #666; }
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.chap-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.05); cursor: pointer; transition: all .2s; border-left: 4px solid var(--p); }
.chap-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.1); }
.chap-card .ct { font-size: 11px; color: #999; }
.chap-card .cn { font-size: 16px; font-weight: 700; color: var(--p); margin: 3px 0 8px; }
.chap-card .cs { font-size: 12px; color: #666; margin-bottom: 8px; }

/* ===== Chapter ===== */
.item-list { display: grid; gap: 10px; }
.item-row { background: #fff; padding: 14px 18px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; cursor: pointer; transition: all .2s; }
.item-row:hover { box-shadow: 0 4px 10px rgba(0,0,0,.1); transform: translateX(2px); }
.item-row .num { font-size: 11px; color: #999; }
.item-row .nam { font-size: 15px; font-weight: 600; color: #333; margin-top: 2px; }
.stage-pills { display: flex; gap: 4px; }
.spill { font-size: 11px; padding: 3px 7px; border-radius: 4px; background: #eee; color: #999; font-weight: 600; }
.spill.passed { background: var(--ok); color: #fff; }
.spill.locked { background: var(--lock); color: #fff; }
.spill.tried { background: var(--a); color: #fff; }
.cleared-badge { background: linear-gradient(135deg, var(--ok), #2e7d32); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 14px; font-weight: 700; }

/* ===== Item Detail ===== */
.item-head { background: #fff; padding: 22px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.05); margin-bottom: 18px; }
.item-head .num { font-size: 12px; color: #999; }
.item-head h3 { font-size: 22px; color: var(--p); margin-top: 4px; }
.stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.stage-card { background: #fff; border-radius: 8px; padding: 18px; box-shadow: 0 2px 4px rgba(0,0,0,.05); border-top: 4px solid #999; transition: all .2s; }
.stage-card.kaisetsu { border-top-color: #1976d2; }
.stage-card.enshu { border-top-color: var(--a); }
.stage-card.shujuku { border-top-color: var(--ok); }
.stage-card.shutoku { border-top-color: #6a1b9a; }
.stage-card.locked { opacity: .55; }
.stage-card .lab { font-size: 11px; color: #999; letter-spacing: .05em; }
.stage-card .ttl { font-size: 17px; font-weight: 700; color: #333; margin: 4px 0 8px; display: flex; align-items: center; gap: 6px; }
.stage-card .desc { font-size: 12px; color: #666; margin-bottom: 12px; min-height: 30px; }
.stage-card .stat-line { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #999; margin-bottom: 10px; }
.stage-card button { width: 100%; padding: 9px; margin-bottom: 6px; }
.stage-card button:last-child { margin-bottom: 0; }
.cleared-banner { background: linear-gradient(135deg, var(--ok), #1b5e20); color: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 14px; font-weight: 700; text-align: center; }

/* ===== Slides (解説) ===== */
.slide-wrap { background: #fff; border-radius: 8px; padding: 30px 36px; box-shadow: 0 2px 4px rgba(0,0,0,.05); max-width: 860px; margin: 0 auto; }
.slide-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 2px solid #e0e0e0; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
.slide-head .ttl { font-size: 22px; font-weight: 700; color: var(--p); }
.slide-num { background: #1976d2; color: #fff; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.slide-body { white-space: pre-wrap; font-size: 16px; line-height: 1.95; color: #222; padding: 14px 4px; }
.slide-body p.first { font-weight: 700; color: var(--p); margin-bottom: 10px; font-size: 17px; }
.slide-nav { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
.slide-thumb { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px dashed #e0e0e0; }
.slide-thumb-btn { background: #f5f5f5; color: #555; border: 1px solid #ddd; border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
.slide-thumb-btn.active { background: #1976d2; color: #fff; border-color: #1976d2; font-weight: 600; }

/* ===== Worksheet ===== */
.ws-wrap { background: #fff; border-radius: 8px; padding: 24px 28px; box-shadow: 0 2px 4px rgba(0,0,0,.05); max-width: 900px; margin: 0 auto; }
.ws-head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 14px; border-bottom: 2px solid #e0e0e0; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
.ws-head .ttl { font-size: 22px; font-weight: 700; color: var(--p); }
.ws-head .meta { font-size: 13px; color: #666; margin-top: 4px; }
.ws-head .actions { display: flex; gap: 8px; flex-shrink: 0; }
.ws-stage-tag { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #fff; margin-right: 8px; }
.ws-stage-tag.enshu { background: var(--a); }
.ws-stage-tag.shujuku { background: var(--ok); }
.ws-stage-tag.shutoku { background: #6a1b9a; }
.ws-content { white-space: pre-wrap; font-size: 14px; line-height: 1.85; color: #222; padding: 18px 20px; background: #fafafa; border-radius: 6px; border: 1px solid #eee; font-family: var(--mono); max-height: 60vh; overflow-y: auto; }
.ws-answers { margin-top: 18px; }
.ws-answers details { background: #fff8e1; border: 1px solid #ffd54f; border-radius: 6px; padding: 12px 16px; }
.ws-answers summary { cursor: pointer; font-weight: 600; color: #f57c00; }
.ws-answers .ans-text { white-space: pre-wrap; font-family: var(--mono); font-size: 13px; line-height: 1.85; margin-top: 12px; padding: 10px 14px; background: #fff; border-radius: 4px; border: 1px solid #ffe082; max-height: 50vh; overflow-y: auto; color: #333; }
.ws-grading { margin-top: 22px; padding: 18px; background: #f0f7ff; border: 1px solid #c5d6f7; border-radius: 6px; }
.ws-grading h4 { color: var(--p); margin-bottom: 12px; }
.ws-grading-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.ws-grading-row label { font-size: 13px; color: #555; }
.ws-grading-row input[type=number] { width: 80px; padding: 8px 10px; border: 1px solid #c5d6f7; border-radius: 4px; font-size: 14px; text-align: center; }
.ws-grading .calc-pct { font-size: 24px; font-weight: 700; color: var(--p); padding: 6px 16px; background: #fff; border-radius: 4px; min-width: 80px; text-align: center; }
.ws-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }

/* ===== Result ===== */
.res-wrap { background: #fff; border-radius: 8px; padding: 30px 36px; box-shadow: 0 2px 4px rgba(0,0,0,.05); max-width: 800px; margin: 0 auto; }
.res-score { text-align: center; padding: 18px 0; }
.res-score .big { font-size: 60px; font-weight: 700; color: var(--p); }
.res-score .lab { font-size: 14px; color: #999; margin-top: 4px; }
.res-judge { text-align: center; padding: 14px; border-radius: 8px; margin: 18px 0; font-weight: 700; }
.res-judge.pass { background: #e8f5e9; color: #1b5e20; border: 2px solid var(--ok); }
.res-judge.fail { background: #ffebee; color: #b71c1c; border: 2px solid var(--ng); }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
.res-history { margin-top: 24px; font-size: 13px; color: #666; }
.res-history table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.res-history th, .res-history td { padding: 6px 10px; border: 1px solid #eee; text-align: left; }
.res-history th { background: #f5f5f5; }

/* ===== Print Sheet (画面表示用 + 印刷モード共通) ===== */
.print-sheet { background: #fff; padding: 20mm 18mm; max-width: 210mm; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); font-family: "Hiragino Mincho ProN","Yu Mincho", "Meiryo", serif; color: #000; }
.print-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
.print-head .left .stage-line { font-size: 11px; color: #555; letter-spacing: .1em; }
.print-head .left .title { font-size: 20px; font-weight: 700; margin-top: 2px; }
.print-head .left .sub { font-size: 12px; color: #555; margin-top: 2px; }
.print-fields { display: grid; grid-template-columns: 2fr 1.2fr 1fr; gap: 10px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid #888; font-size: 12px; }
.print-fields .field { display: flex; align-items: flex-end; gap: 6px; }
.print-fields .field .lbl { color: #444; flex-shrink: 0; }
.print-fields .field .blank { flex: 1; border-bottom: 1px solid #000; min-height: 22px; }
.print-fields .field.score .blank { display: flex; align-items: center; justify-content: center; gap: 4px; }
.print-fields .field.score .scoreboxes { display: flex; align-items: baseline; gap: 4px; font-size: 14px; }
.print-fields .field.score .scoreboxes .num { display: inline-block; min-width: 40px; border-bottom: 1px solid #000; text-align: center; padding: 0 6px; min-height: 20px; }
.print-body { white-space: pre-wrap; font-family: "Hiragino Mincho ProN","Yu Mincho", "Meiryo", serif; font-size: 13px; line-height: 1.95; }
.print-foot { margin-top: 18px; font-size: 10px; color: #888; text-align: right; }

/* ===== Toast ===== */
#toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 2000; display: none; }
#toast.show { display: block; animation: slide .25s ease-out; }
#toast.ok { background: var(--ok); }
#toast.ng { background: var(--ng); }
@keyframes slide { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ===== Print mode ===== */
@media print {
  body { background: #fff !important; }
  .topnav, .sidebar, .crumb, .ws-wrap > .ws-head .actions, .ws-grading, .ws-actions, .ws-answers, #toast, .res-wrap > .res-actions { display: none !important; }
  .layout { display: block !important; }
  .main { padding: 0 !important; max-width: none !important; }
  .ws-wrap, .res-wrap { box-shadow: none !important; padding: 0 !important; }
  .print-sheet { box-shadow: none !important; padding: 12mm 14mm !important; max-width: none !important; }
  .print-body { font-size: 12px; }
  @page { size: A4; margin: 12mm; }
}
.printing #app-shell { display: none; }
.printing #print-host { display: block; }
#print-host { display: none; }
</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="page-login">
  <div class="login-card">
    <h1>📚 英文法学習サイト</h1>

    <div class="tabs">

      <div class="fg"><label>ユーザーID</label><input id="ri-id" class="fi"></div>

</div>

<!-- ============ APP ============ -->
<div id="page-app">
  <div id="app-shell">
    <div class="topnav">
      <div class="topnav-brand" onclick="goView('dashboard')">📚 英文法学習サイト</div>
      <div class="topnav-r">
        <span class="user-pill"><span id="nv-name"></span>（<span id="nv-role"></span>）</span>

      </div>
    </div>
    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="main">
        <div id="view-dashboard" class="view">
          <div class="h2">🏠 ダッシュボード</div>
          <div class="stat-grid" id="stat-grid"></div>
          <div class="h2" style="font-size:18px;margin-top:8px">📖 章を選んで学習を始める</div>

        </div>
        <div id="view-chapter" class="view">

</div>

<div id="toast"></div>

<!-- カリキュラムデータ（PDFから自動抽出） -->
<script id="curriculum-data" type="application/json">
/* @@CURRICULUM_DATA@@ */
</script>

<script>
'use strict';
/* ============================================================
   英文法学習サイト v3（完成版）
   - 17章 224項目 × 演習/習熟/習得 = 672 ワークシート
   - PDFから抽出した全問題を画面表示・印刷
   - 段階制ロック（85%以上で次解放）
   ============================================================ */

const PASS_MARK = 85;
const STORAGE_USER = 'grm_v3_user';
const STORAGE_STAGE = 'grm_v3_stage';
const STORAGE_USERS = 'grm_v3_users';
const STORAGE_HISTORY = 'grm_v3_history';

// API同期：file://なら無効、http(s)://ならサーバーAPI（同オリジン）を使う
const IS_HOSTED = (location.protocol === 'http:' || location.protocol === 'https:');
const API_BASE = IS_HOSTED ? '' : ''; // 空なら同オリジン
async function apiGet(path, params) {
  if (!IS_HOSTED) return null;
  const u = new URL(path, location.origin);
  if (params) Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  try {
    const r = await fetch(u.toString());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { console.warn('apiGet fail', path, e); return null; }
}

// PDFパスの解決：ローカル(file://)なら ../第NN章/...、ホスト(http(s))なら /pdf/第NN章/...
function pdfUrl(p) {
  if (!p) return '';
  if (IS_HOSTED) return p.replace(/^\.\.\//, '/pdf/');
  return p;
}

// カリキュラムロード
const CURRICULUM = JSON.parse(document.getElementById('curriculum-data').textContent);

let state = {
  user: null,
  currentChapter: null,
  currentItem: null,
  currentStage: null
};

/* ============================================================
   起動
   ============================================================ */
function init() {
  let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  if (!users.demo)  users.demo  = { name:'デモ太郎', pw:'demo',  role:'student' };
  if (!users.admin) users.admin = { name:'管理者',   pw:'admin', role:'admin'   };
  localStorage.setItem(STORAGE_USERS, JSON.stringify(users));

  const u = JSON.parse(localStorage.getItem(STORAGE_USER) || 'null');
  if (u) { state.user = u; enterApp(); } else { showLogin(); }
}

function switchTab(ev, t) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  ev.target.classList.add('active');
  document.getElementById('form-login').style.display = (t==='login') ? 'block':'none';
  document.getElementById('form-reg').style.display   = (t==='reg')   ? 'block':'none';
}
function showLogin() { document.getElementById('page-login').style.display='flex'; document.getElementById('page-app').style.display='none'; }
async function enterApp() {
  document.getElementById('page-login').style.display='none';
  document.getElementById('page-app').style.display='block';
  document.getElementById('nv-name').textContent = state.user.name;
  document.getElementById('nv-role').textContent = state.user.role;
  // サーバーから進捗をプル（あれば優先反映）
  if (IS_HOSTED) {
    const res = await apiGet('/getStageStatus', { uid: state.user.uid });
    if (res?.ok && res.status) {
      const all = JSON.parse(localStorage.getItem(STORAGE_STAGE) || '{}');
      all[state.user.uid] = all[state.user.uid] || {};
      Object.entries(res.status).forEach(([itemId, stages]) => {
        all[state.user.uid][itemId] = all[state.user.uid][itemId] || {};
        Object.entries(stages).forEach(([sk, st]) => {
          const local = all[state.user.uid][itemId][sk] || { best:0, attempts:0, passed:false };
          // best/attemptsはmax/和を取る
          local.best = Math.max(local.best || 0, st.best || 0);
          local.attempts = Math.max(local.attempts || 0, st.attempts || 0);
          local.passed = local.passed || st.passed;
          if (st.passed_at) local.passed_at = st.passed_at;
          all[state.user.uid][itemId][sk] = local;
        });
      });
      localStorage.setItem(STORAGE_STAGE, JSON.stringify(all));
    }
  }
  renderSidebar(); goView('dashboard');
}
function doLogin() {
  const id=document.getElementById('li-id').value.trim();
  const pw=document.getElementById('li-pw').value;
  const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  if (!users[id] || users[id].pw !== pw) { document.getElementById('li-err').textContent='IDかパスワードが違います'; return; }
  state.user = { uid:id, name:users[id].name, role:users[id].role };
  localStorage.setItem(STORAGE_USER, JSON.stringify(state.user));
  enterApp();
}
function doRegister() {
  const id=document.getElementById('ri-id').value.trim();
  const nm=document.getElementById('ri-name').value.trim();
  const pw=document.getElementById('ri-pw').value;
  if (!id||!nm||!pw) { document.getElementById('ri-err').textContent='全項目入力してください'; return; }
  const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  if (users[id]) { document.getElementById('ri-err').textContent='既存のIDです'; return; }
  users[id] = { name:nm, pw:pw, role:'student' };
  localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
  state.user = { uid:id, name:nm, role:'student' };
  localStorage.setItem(STORAGE_USER, JSON.stringify(state.user));
  enterApp();
}
function doLogout() { localStorage.removeItem(STORAGE_USER); state.user=null; showLogin(); }

/* ============================================================
   進捗
   ============================================================ */
function getStageStatusAll() {
  const all = JSON.parse(localStorage.getItem(STORAGE_STAGE) || '{}');
  return all[state.user.uid] || {};
}
function saveStageResult(itemId, stage, score) {
  const all = JSON.parse(localStorage.getItem(STORAGE_STAGE) || '{}');
  if (!all[state.user.uid]) all[state.user.uid] = {};
  if (!all[state.user.uid][itemId]) all[state.user.uid][itemId] = {};
  const cur = all[state.user.uid][itemId][stage] || { best:0, attempts:0, passed:false };
  cur.attempts += 1;
  cur.best = Math.max(cur.best, score);
  cur.last = Date.now();
  if (score >= PASS_MARK && !cur.passed) {
    cur.passed = true;
    cur.passed_at = new Date().toISOString().slice(0,10);
  }
  all[state.user.uid][itemId][stage] = cur;
  localStorage.setItem(STORAGE_STAGE, JSON.stringify(all));
  // サーバー同期（ホスト時のみ）
  if (IS_HOSTED) {
    apiGet('/saveStageStatus', { uid: state.user.uid, item_id: itemId, stage, score }).catch(()=>{});
  }

  // 履歴も保存
  const hist = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '{}');
  if (!hist[state.user.uid]) hist[state.user.uid] = [];
  hist[state.user.uid].push({
    itemId, stage, score, at: new Date().toISOString().slice(0,16).replace('T',' ')
  });
  // 直近100件のみ保持
  if (hist[state.user.uid].length > 100) hist[state.user.uid] = hist[state.user.uid].slice(-100);
  localStorage.setItem(STORAGE_HISTORY, JSON.stringify(hist));

  return cur;
}
function getItemStageState(itemId) {
  const s = getStageStatusAll()[itemId] || {};
  return {
    enshu:   { unlocked: true,                best: s.enshu?.best   || 0, passed: s.enshu?.passed   || false, attempts: s.enshu?.attempts || 0 },
    shujuku: { unlocked: !!s.enshu?.passed,   best: s.shujuku?.best || 0, passed: s.shujuku?.passed || false, attempts: s.shujuku?.attempts || 0 },
    shutoku: { unlocked: !!s.shujuku?.passed, best: s.shutoku?.best || 0, passed: s.shutoku?.passed || false, attempts: s.shutoku?.attempts || 0 }
  };
}
function isItemCleared(itemId) { return getItemStageState(itemId).shutoku.passed; }
function chapterProgress(ch) {
  const total = ch.items.length;
  const cleared = ch.items.filter(i => isItemCleared(i.id)).length;
  return { total, cleared };
}
function getItemHistory(itemId, stage) {
  const hist = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '{}');
  const arr = hist[state.user.uid] || [];
  return arr.filter(h => h.itemId === itemId && h.stage === stage).slice(-10).reverse();
}

function renderSidebar() {

function goView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));

/* ============================================================
   ダッシュボード
   ============================================================ */
function renderDashboard() {
  let totalItems=0, clearedItems=0, totalAttempts=0, totalPassed=0;
  CURRICULUM.chapters.forEach(ch => {
    ch.items.forEach(it => {
      totalItems++;
      const ss = getItemStageState(it.id);
      ['enshu','shujuku','shutoku'].forEach(s => {
        totalAttempts += ss[s].attempts;
        if (ss[s].passed) totalPassed++;
      });
      if (isItemCleared(it.id)) clearedItems++;
    });
  });
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="lab">クリア項目</div><div class="num">${clearedItems} / ${totalItems}</div>
      <div class="bar"><div style="width:${totalItems?Math.round(clearedItems/totalItems*100):0}%"></div></div>
      <div class="sub2" style="margin-top:6px">3段階すべて85%以上</div></div>
    <div class="stat-card"><div class="lab">合格段階数</div><div class="num">${totalPassed} <span style="font-size:14px;color:#999">/ ${totalItems*3}</span></div><div class="sub2">演習・習熟・習得 合計</div></div>
    <div class="stat-card"><div class="lab">総挑戦回数</div><div class="num">${totalAttempts}</div><div class="sub2">これまでの解答セッション</div></div>
    <div class="stat-card"><div class="lab">合格ライン</div><div class="num">${PASS_MARK}%</div><div class="sub2">各段階の合格基準</div></div>`;

  const cg = document.getElementById('chap-grid'); cg.innerHTML = '';
  CURRICULUM.chapters.forEach(ch => {
    const { total, cleared } = chapterProgress(ch);
    const card = document.createElement('div');
    card.className = 'chap-card'; card.style.borderLeftColor = ch.color;
    card.innerHTML = `
      <div class="ct">第${String(ch.num).padStart(2,'0')}章</div>
      <div class="cn">${escHtml(ch.title)}</div>
      <div class="cs">項目 ${total}・クリア ${cleared}</div>
      <div class="bar"><div style="width:${total?Math.round(cleared/total*100):0}%;background:${ch.color}"></div></div>`;
    card.onclick = () => openChapter(ch.id);
    cg.appendChild(card);
  });
}

/* ============================================================
   章
   ============================================================ */
function openChapter(id) {
  const ch = CURRICULUM.chapters.find(c => c.id===id); if (!ch) return;
  state.currentChapter = ch;
  document.getElementById('ch-crumb').textContent = `第${String(ch.num).padStart(2,'0')}章 ${ch.title}`;
  document.getElementById('ch-title').textContent = `📖 第${String(ch.num).padStart(2,'0')}章 ${ch.title}`;
  const host = document.getElementById('ch-items'); host.innerHTML = '';
  ch.items.forEach(it => {
    const ss = getItemStageState(it.id);
    const cleared = isItemCleared(it.id);
    const pill = (s, st) => {
      if (st.passed) return `<span class="spill passed">${s} ✓</span>`;
      if (!st.unlocked) return `<span class="spill locked">${s} 🔒</span>`;
      if (st.attempts > 0) return `<span class="spill tried">${s} ${st.best}%</span>`;
      return `<span class="spill">${s}</span>`;
    };
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div><div class="num">第${String(ch.num).padStart(2,'0')}章 - ${it.num}</div><div class="nam">${escHtml(it.name)}</div></div>
      <div class="stage-pills">${pill('演習',ss.enshu)}${pill('習熟',ss.shujuku)}${pill('習得',ss.shutoku)}</div>
      <div>${cleared ? '<span class="cleared-badge">🏆 CLEAR</span>' : '<span style="color:#999;font-size:12px">学習する ▸</span>'}</div>`;
    row.onclick = () => openItem(it.id);
    host.appendChild(row);
  });
  goView('chapter');
}

/* ============================================================
   項目
   ============================================================ */
function openItem(id) {
  const ch = state.currentChapter;
  const it = ch.items.find(i => i.id===id); if (!it) return;
  state.currentItem = it;
  document.getElementById('it-crumb').textContent = `${it.num} ${it.name}`;
  const a = document.getElementById('it-crumb-ch'); a.textContent = `第${String(ch.num).padStart(2,'0')}章 ${ch.title}`;
  a.onclick = () => openChapter(ch.id);
  document.getElementById('it-num').textContent = `第${String(ch.num).padStart(2,'0')}章 - ${it.num}`;
  document.getElementById('it-name').textContent = it.name;

  document.getElementById('it-cleared').innerHTML = isItemCleared(it.id)
    ? '<div class="cleared-banner">🏆 この項目は3段階すべて85%以上を達成しています！</div>' : '';

  const ss = getItemStageState(it.id);
  const host = document.getElementById('it-stages'); host.innerHTML = '';

  // STEP 0：解説カード（常時表示・ロックなし）
  const slidesCount = (it.slides || []).length;
  const kaisetsuCard = document.createElement('div');
  kaisetsuCard.className = 'stage-card kaisetsu';
  kaisetsuCard.innerHTML = `
    <div class="lab">STEP 0</div>
    <div class="ttl">📘 解説</div>
    <div class="desc">スライドで仕組みを学習（${slidesCount}枚）</div>
    <div class="stat-line"><span>いつでも閲覧可能</span><span>${slidesCount}枚</span></div>`;
  const bView = document.createElement('button');
  bView.className = 'btn btn-p'; bView.textContent = '📖 解説を開く';
  bView.onclick = () => openSlides(it.id);
  if (slidesCount === 0) { bView.disabled = true; bView.textContent='（解説なし）'; bView.className='btn btn-lock'; }
  kaisetsuCard.appendChild(bView);
  if (it.pptx_path) {
    const bPpt = document.createElement('button');
    bPpt.className = 'btn btn-o';
    bPpt.textContent = '📄 PPTXを開く';
    bPpt.onclick = () => window.open(pdfUrl(it.pptx_path), '_blank');
    kaisetsuCard.appendChild(bPpt);
  }
  host.appendChild(kaisetsuCard);

  ['enshu','shujuku','shutoku'].forEach((sk, i) => {
    const labMap = {enshu:'STEP 1 演習', shujuku:'STEP 2 習熟', shutoku:'STEP 3 習得'};
    const titleMap = {enshu:'📝 演習', shujuku:'✏️ 習熟', shutoku:'🎯 習得'};
    const descMap = {enshu:'基礎レベルの問題', shujuku:'定着用の問題', shutoku:'入試レベルの仕上げ問題'};
    const lockMsg = sk==='shujuku' ? '演習で85%以上 → 解放' : (sk==='shutoku' ? '習熟で85%以上 → 解放' : '');
    const st = ss[sk];
    const stage = it.stages[sk];
    const tag = st.passed ? '✅' : (st.attempts>0 ? '🔄' : (st.unlocked ? '' : '🔒'));
    const line = st.attempts>0 ? `挑戦${st.attempts}回 / 最高 ${st.best}%` : (st.unlocked ? '挑戦待ち' : lockMsg);
    let btnText, btnCls, enabled, click;
    if (!st.unlocked) { btnText='🔒 ロック中'; btnCls='btn-lock'; enabled=false; }
    else if (st.passed) { btnText='もう一度挑戦'; btnCls='btn-o'; enabled=true; click=()=>openWorksheet(it.id, sk); }
    else                 { btnText='挑戦する'; btnCls='btn-a'; enabled=true; click=()=>openWorksheet(it.id, sk); }
    const printEnabled = st.unlocked || true; // 印刷はロックでも可能にしておく
    const card = document.createElement('div');
    card.className = `stage-card ${sk}` + (st.unlocked ? '' : ' locked');
    card.innerHTML = `
      <div class="lab">${labMap[sk]}</div>
      <div class="ttl">${titleMap[sk]} ${tag}</div>
      <div class="desc">${descMap[sk]}（推定 ${stage.q_count}問）</div>
      <div class="stat-line"><span>${line}</span><span>${stage.q_count?stage.q_count+'問':''}</span></div>`;
    const btn1 = document.createElement('button');
    btn1.className = `btn ${btnCls}`; btn1.textContent = btnText;
    if (!enabled) btn1.disabled = true;
    if (click) btn1.onclick = click;
    card.appendChild(btn1);
    if (st.unlocked) {
      const btn2 = document.createElement('button');
      btn2.className = 'btn btn-print';
      btn2.textContent = '🖨️ 印刷用プリント';
      btn2.onclick = () => printSheet(it.id, sk);
      card.appendChild(btn2);
    }
    host.appendChild(card);
  });

  goView('item');
}

/* ============================================================
   解説スライド画面
   ============================================================ */
let _slideIdx = 0;
function openSlides(itemId) {
  const ch = state.currentChapter;
  const it = state.currentItem || ch.items.find(i=>i.id===itemId);
  if (!it.slides || it.slides.length===0) { toast('解説スライドが登録されていません','ng'); return; }
  state.currentItem = it;
  _slideIdx = 0;
  renderSlide();
  goView('slides');
}
function renderSlide() {
  const it = state.currentItem;
  const ch = state.currentChapter;
  const total = it.slides.length;
  if (_slideIdx < 0) _slideIdx = 0;
  if (_slideIdx >= total) _slideIdx = total - 1;
  const s = it.slides[_slideIdx];
  // content の1行目を強調表示
  const lines = s.content.split('\n');
  let body = '';
  if (lines.length > 0) {
    body = `<p class="first">${escHtml(lines[0])}</p>` + (lines.length>1 ? `<div>${escHtml(lines.slice(1).join('\n'))}</div>` : '');
  }
  const thumbs = it.slides.map((_,i)=>`<button class="slide-thumb-btn ${i===_slideIdx?'active':''}" onclick="jumpSlide(${i})">${i+1}</button>`).join('');
  document.getElementById('slides-host').innerHTML = `
    <div class="slide-wrap">
      <div class="slide-head">
        <div>
          <span class="ws-stage-tag" style="background:#1976d2">解説</span>
          <span style="font-size:13px;color:#999">第${String(ch.num).padStart(2,'0')}章 - ${it.num}</span>
          <div class="ttl" style="margin-top:4px">${escHtml(s.title)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="slide-num">${_slideIdx+1} / ${total}</span>
          <button class="btn btn-o" onclick="openItem('${it.id}')">項目に戻る</button>
        </div>
      </div>
      <div class="slide-body">${body}</div>
      <div class="slide-nav">
        <button class="btn btn-o" onclick="prevSlide()" ${_slideIdx===0?'disabled':''}>← 前のスライド</button>
        ${_slideIdx < total-1
          ? `<button class="btn btn-p" onclick="nextSlide()">次のスライド →</button>`
          : `<button class="btn btn-a" onclick="openWorksheet('${it.id}','enshu')">演習に進む →</button>`}
      </div>
      <div class="slide-thumb">${thumbs}</div>
    </div>`;
}
function prevSlide() { _slideIdx--; renderSlide(); }
function nextSlide() { _slideIdx++; renderSlide(); }
function jumpSlide(i) { _slideIdx = i; renderSlide(); }

/* ============================================================
   ワークシート（問題画面）
   ============================================================ */
function openWorksheet(itemId, stage) {
  const it = state.currentItem;
  const ss = getItemStageState(itemId);
  if (!ss[stage].unlocked) { toast('まだロックされています','ng'); return; }
  state.currentStage = stage;
  const stData = it.stages[stage];
  const ch = state.currentChapter;
  const stageLabel = stData.label;

  document.getElementById('worksheet-host').innerHTML = `
    <div class="ws-wrap">
      <div class="ws-head">
        <div>
          <span class="ws-stage-tag ${stage}">${stageLabel}</span>
          <span style="font-size:13px;color:#999">第${String(ch.num).padStart(2,'0')}章 - ${it.num}</span>
          <div class="ttl">${escHtml(it.name)}</div>
          <div class="meta">推定 ${stData.q_count} 問　／　合格ライン ${PASS_MARK}%</div>
        </div>
        <div class="actions">
          <button class="btn btn-print" onclick="printSheet('${itemId}','${stage}')">🖨️ 印刷</button>
          ${(it.slides && it.slides.length) ? `<button class="btn btn-o" onclick="openSlides('${itemId}')">📘 解説を見る</button>` : ''}
          <button class="btn btn-o" onclick="openItem('${itemId}')">項目に戻る</button>
        </div>
      </div>
      <div class="ws-content">${escHtml(stData.problem_text || '（問題テキストの抽出に失敗しました）')}</div>

      <div class="ws-answers">
        <details>
          <summary>📖 解答・解説を表示する（採点後に確認しましょう）</summary>
          ${stData.answer_text
            ? `<div class="ans-text">${escHtml(stData.answer_text)}</div>`
            : `<div style="margin-top:10px">
                 <p style="color:#666;font-size:13px;margin-bottom:8px">この段階の解答は画像PDFのため自動抽出できませんでした。下記から元のPDFを開いてご確認ください。</p>
                 <a class="btn btn-print" target="_blank" href="${escHtml(pdfUrl(stData.answer_pdf))}" style="display:inline-block">📄 解答PDFを開く</a>
                 <a class="btn btn-o" target="_blank" href="${escHtml(pdfUrl(stData.problem_pdf))}" style="display:inline-block;margin-left:6px">📄 問題PDFも開く</a>
               </div>`}
        </details>
      </div>

      <div class="ws-grading">
        <h4>📊 自己採点 → 合否判定</h4>
        <div class="ws-grading-row">
          <label>正解数</label>
          <input type="number" id="g-correct" min="0" value="" placeholder="0">
          <label>／ 全問数</label>
          <input type="number" id="g-total" min="1" value="${stData.q_count || 10}" placeholder="${stData.q_count || 10}">
          <label style="margin-left:20px">得点率</label>
          <span class="calc-pct" id="g-pct">--%</span>
        </div>
        <div class="ws-grading-row">
          <button class="btn btn-a" onclick="calcAndSubmit('${itemId}','${stage}')">採点を確定する</button>
          <span style="font-size:12px;color:#666">※ プリントで解いた点数を入力して採点を確定すると、合格判定 → 段階解放が走ります。</span>
        </div>
      </div>

      <div class="ws-actions">
        <button class="btn btn-o" onclick="openItem('${itemId}')">← 項目に戻る</button>
        <button class="btn btn-print" onclick="printSheet('${itemId}','${stage}')">🖨️ プリント印刷</button>
        ${stData.problem_pdf ? `<a class="btn btn-o" target="_blank" href="${escHtml(pdfUrl(stData.problem_pdf))}">📄 元のPDFを開く</a>` : ''}
      </div>
    </div>`;

  // pct自動計算
  const upd = () => {
    const c = parseInt(document.getElementById('g-correct').value);
    const t = parseInt(document.getElementById('g-total').value);
    if (!isFinite(c) || !isFinite(t) || t<=0) { document.getElementById('g-pct').textContent='--%'; return; }
    const pct = Math.round(c/t*100);
    document.getElementById('g-pct').textContent = pct + '%';
    document.getElementById('g-pct').style.color = pct>=PASS_MARK ? 'var(--ok)' : 'var(--ng)';
  };
  document.getElementById('g-correct').addEventListener('input', upd);
  document.getElementById('g-total').addEventListener('input', upd);

  goView('worksheet');
}

function calcAndSubmit(itemId, stage) {
  const c = parseInt(document.getElementById('g-correct').value);
  const t = parseInt(document.getElementById('g-total').value);
  if (!isFinite(c) || !isFinite(t) || t<=0) { toast('正解数と全問数を入力してください','ng'); return; }
  if (c < 0 || c > t) { toast('正解数は 0〜全問数 の範囲で入力してください','ng'); return; }
  const score = Math.round(c/t*100);
  const cur = saveStageResult(itemId, stage, score);
  showResult(itemId, stage, score, c, t, cur);
}

/* ============================================================
   結果画面
   ============================================================ */
function showResult(itemId, stage, score, correct, total, cur) {
  const it = state.currentItem;
  const passed = score >= PASS_MARK;
  const stageLabel = it.stages[stage].label;
  const next = stage==='enshu' ? 'shujuku' : (stage==='shujuku' ? 'shutoku' : null);
  const nextLabel = next ? it.stages[next].label : null;
  const hist = getItemHistory(itemId, stage);

  let nextActions = '';
  if (passed) {
    if (next) {
      nextActions = `<button class="btn btn-a" onclick="openWorksheet('${itemId}','${next}')">${nextLabel}に進む →</button>
                     <button class="btn btn-o" onclick="openItem('${itemId}')">項目TOPへ</button>`;
    } else {
      nextActions = `<button class="btn btn-ok" onclick="openItem('${itemId}')">🏆 項目クリア！TOPへ</button>`;
    }
  } else {
    nextActions = `<button class="btn btn-a" onclick="openWorksheet('${itemId}','${stage}')">同じ段階を再挑戦</button>
                   ${(it.slides && it.slides.length) ? `<button class="btn btn-o" onclick="openSlides('${itemId}')">📘 解説を見直す</button>` : ''}
                   <button class="btn btn-o" onclick="openItem('${itemId}')">項目TOPへ</button>`;
  }

  const histRows = hist.length
    ? hist.map(h=>`<tr><td>${h.at}</td><td>${h.score}%</td></tr>`).join('')
    : '<tr><td colspan="2" style="text-align:center;color:#999">履歴なし</td></tr>';

  document.getElementById('result-host').innerHTML = `
    <div class="res-wrap">
      <div class="ws-head">
        <div>
          <span class="ws-stage-tag ${stage}">${stageLabel}</span>
          <div style="font-size:13px;color:#999;margin-top:4px">${escHtml(it.name)} 結果</div>
        </div>
        <div class="actions">
          <button class="btn btn-o" onclick="openItem('${itemId}')">項目TOPへ</button>
        </div>
      </div>
      <div class="res-score"><div class="big">${score}<span style="font-size:24px">点</span></div><div class="lab">${correct} / ${total} 問正解</div></div>
      <div class="res-judge ${passed?'pass':'fail'}">
        ${passed
          ? (next ? `🎉 合格！「${nextLabel}」が解放されました` : '🏆 おめでとう！この項目をクリアしました（3段階すべて達成）')
          : `😢 ${PASS_MARK}%に届かず（あと${PASS_MARK-score}%） — 解説を見直してもう一度挑戦`}
      </div>
      <div class="res-history">
        <strong>これまでの${stageLabel}結果（直近10件）</strong>
        <table><thead><tr><th>日時</th><th>得点</th></tr></thead><tbody>${histRows}</tbody></table>
        <div style="margin-top:8px;color:#666">最高得点：${cur.best}% / 挑戦${cur.attempts}回</div>
      </div>
      <div class="res-actions">${nextActions}</div>
    </div>`;
  goView('result');
  toast(passed ? '合格！' : `あと${PASS_MARK-score}%`, passed?'ok':'ng');
}

/* ============================================================
   印刷（プリント生成）
   ============================================================ */
function printSheet(itemId, stage) {
  const ch = state.currentChapter || CURRICULUM.chapters.find(c => c.items.some(i=>i.id===itemId));
  const it = state.currentItem || ch.items.find(i=>i.id===itemId);
  const stData = it.stages[stage];
  const today = new Date(); const yyyy = today.getFullYear(); const mm = String(today.getMonth()+1).padStart(2,'0'); const dd = String(today.getDate()).padStart(2,'0');
  const dateStr = `${yyyy}年${mm}月${dd}日`;

  const html = `
    <div class="print-sheet">
      <div class="print-head">
        <div class="left">
          <div class="stage-line">英文法 通常学習編 ／ 第${String(ch.num).padStart(2,'0')}章 ${escHtml(ch.title)} ／ ${stData.label}プリント</div>
          <div class="title">${escHtml(it.name)}</div>
          <div class="sub">項目番号：${ch.id}_${it.num}　／　推定 ${stData.q_count} 問　／　合格ライン ${PASS_MARK}%</div>
        </div>
        <div style="text-align:right;font-size:11px;color:#444">出題日：${dateStr}</div>
      </div>
      <div class="print-fields">
        <div class="field"><span class="lbl">名前：</span><span class="blank"></span></div>
        <div class="field"><span class="lbl">日付：</span><span class="blank">　　　年　　月　　日</span></div>
        <div class="field score"><span class="lbl">得点：</span>
          <span class="scoreboxes"><span class="num"></span><span>／</span><span class="num">${stData.q_count || ''}</span><span style="font-size:12px">　（　　　 %）</span></span>
        </div>
      </div>
      <div class="print-body">${escHtml(stData.problem_text || '（問題テキストなし）')}</div>
      <div class="print-foot">英文法学習サイト v3 ／ ${dateStr} 印刷</div>
    </div>`;

  document.getElementById('print-host').innerHTML = html;
  document.body.classList.add('printing');
  setTimeout(() => {
    window.print();
    document.body.classList.remove('printing');
    document.getElementById('print-host').innerHTML = '';
  }, 100);
}

/* ============================================================
   ユーティリティ
   ============================================================ */
function escHtml(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + (kind||'ok');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.className='', 2200);
}

window.addEventListener('DOMContentLoaded', init);
</script>
